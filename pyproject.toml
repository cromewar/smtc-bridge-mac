[project]
name = "smtc-bridge-mac"
version = "1.0.0"
description = "Exposes macOS Now Playing (MediaRemote) as the SMTC Bridge REST API"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Vasiliy Kirochka" }]
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "psutil>=5.9",
    "rumps>=0.4",
    "pyobjc-framework-Cocoa>=10",
    "pillow>=10",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.10",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
